name: build-multiplatform

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VERSION: "1.0.0"

jobs:
  # ---------------- Windows ----------------
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: build app + installer
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Xiyu --icon "${{ github.workspace }}/assets/icon.ico" --distpath "${{ github.workspace }}/dist" --workpath "${{ github.workspace }}/build" --specpath "${{ github.workspace }}/build" main.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name XiyuSetup --icon "${{ github.workspace }}/assets/icon.ico" --add-data "${{ github.workspace }}/dist/Xiyu;app" --add-data "${{ github.workspace }}/assets/icon.ico;." --distpath "${{ github.workspace }}" --workpath "${{ github.workspace }}/build_setup" --specpath "${{ github.workspace }}/build_setup" installer/installer.py
          New-Item -ItemType Directory -Force pkg/Xiyu-$env:VERSION-windows-x64 | Out-Null
          Copy-Item dist/Xiyu/* pkg/Xiyu-$env:VERSION-windows-x64 -Recurse
          Copy-Item README.md, LICENSE, 使用说明.txt pkg/Xiyu-$env:VERSION-windows-x64
          Compress-Archive -Path pkg/Xiyu-$env:VERSION-windows-x64 -DestinationPath Xiyu-$env:VERSION-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            XiyuSetup.exe
            Xiyu-${{ env.VERSION }}-windows-x64.zip

  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x86
      - name: build app + installer
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Xiyu --icon "${{ github.workspace }}/assets/icon.ico" --distpath "${{ github.workspace }}/dist" --workpath "${{ github.workspace }}/build" --specpath "${{ github.workspace }}/build" main.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name XiyuSetup-x86 --icon "${{ github.workspace }}/assets/icon.ico" --add-data "${{ github.workspace }}/dist/Xiyu;app" --add-data "${{ github.workspace }}/assets/icon.ico;." --distpath "${{ github.workspace }}" --workpath "${{ github.workspace }}/build_setup" --specpath "${{ github.workspace }}/build_setup" installer/installer.py
          New-Item -ItemType Directory -Force pkg/Xiyu-$env:VERSION-windows-x86 | Out-Null
          Copy-Item dist/Xiyu/* pkg/Xiyu-$env:VERSION-windows-x86 -Recurse
          Copy-Item README.md, LICENSE, 使用说明.txt pkg/Xiyu-$env:VERSION-windows-x86
          Compress-Archive -Path pkg/Xiyu-$env:VERSION-windows-x86 -DestinationPath Xiyu-$env:VERSION-windows-x86.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            XiyuSetup-x86.exe
            Xiyu-${{ env.VERSION }}-windows-x86.zip

  windows-arm64:
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: arm64
      - name: build app
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Xiyu --icon "${{ github.workspace }}/assets/icon.ico" --distpath "${{ github.workspace }}/dist" --workpath "${{ github.workspace }}/build" --specpath "${{ github.workspace }}/build" main.py
          New-Item -ItemType Directory -Force pkg/Xiyu-$env:VERSION-windows-arm64 | Out-Null
          Copy-Item dist/Xiyu/* pkg/Xiyu-$env:VERSION-windows-arm64 -Recurse
          Copy-Item README.md, LICENSE, 使用说明.txt pkg/Xiyu-$env:VERSION-windows-arm64
          Compress-Archive -Path pkg/Xiyu-$env:VERSION-windows-arm64 -DestinationPath Xiyu-$env:VERSION-windows-arm64.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: Xiyu-${{ env.VERSION }}-windows-arm64.zip

  # ---------------- Linux ----------------
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip pyinstaller
      - name: build
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Xiyu main.py
          mkdir -p pkg/Xiyu-${VERSION}-linux-x64
          cp dist/Xiyu pkg/Xiyu-${VERSION}-linux-x64/
          cp README.md LICENSE pkg/Xiyu-${VERSION}-linux-x64/
          cd pkg && tar czf ../Xiyu-${VERSION}-linux-x64.tar.gz Xiyu-${VERSION}-linux-x64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: Xiyu-${{ env.VERSION }}-linux-x64.tar.gz

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip pyinstaller
      - name: build
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Xiyu main.py
          mkdir -p pkg/Xiyu-${VERSION}-linux-arm64
          cp dist/Xiyu pkg/Xiyu-${VERSION}-linux-arm64/
          cp README.md LICENSE pkg/Xiyu-${VERSION}-linux-arm64/
          cd pkg && tar czf ../Xiyu-${VERSION}-linux-arm64.tar.gz Xiyu-${VERSION}-linux-arm64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: Xiyu-${{ env.VERSION }}-linux-arm64.tar.gz

  # ---------------- macOS ----------------
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -c "import tkinter" || brew install python-tk@3.11
      - name: build
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Xiyu main.py
          mkdir -p pkg
          cp -R dist/Xiyu.app pkg/
          cp README.md LICENSE pkg/
      - name: make dmg
        run: |
          hdiutil create -volname "Xiyu ${VERSION}" -srcfolder pkg -ov -format UDZO Xiyu-${VERSION}-macos-arm64.dmg
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: Xiyu-${{ env.VERSION }}-macos-arm64.dmg

  macos-x64:
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -c "import tkinter" || brew install python-tk@3.11
      - name: build
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Xiyu main.py
          mkdir -p pkg
          cp -R dist/Xiyu.app pkg/
          cp README.md LICENSE pkg/
      - name: make dmg
        run: |
          hdiutil create -volname "Xiyu ${VERSION}" -srcfolder pkg -ov -format UDZO Xiyu-${VERSION}-macos-x64.dmg
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: Xiyu-${{ env.VERSION }}-macos-x64.dmg

  # ---------------- Android 原生 ----------------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cleanup stray settings.gradle dir
        continue-on-error: true
        run: |
          if [ -d android/settings.gradle ]; then
            rm -rf android/settings.gradle
            git config user.name "xiyu-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            git commit -m "chore: remove stray android/settings.gradle directory"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: generate launcher icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          import os
          src = Image.open("assets/icon256.png").convert("RGBA")
          for name, size in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96),
                             ("xxhdpi", 144), ("xxxhdpi", 192)]:
              d = "android/app/src/main/res/mipmap-" + name
              os.makedirs(d, exist_ok=True)
              src.resize((size, size), Image.LANCZOS).save(d + "/ic_launcher.png")
          print("icons ok")
          PY
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: sdk packages
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDKROOT=$SDKROOT"
          echo "sdk.dir=$SDKROOT" > android/local.properties
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5 || true
          echo "--- installed platforms ---"; ls "$SDKROOT/platforms" 2>/dev/null || true
          echo "--- installed build-tools ---"; ls "$SDKROOT/build-tools" 2>/dev/null || true
      - name: prepare settings
        working-directory: android
        run: |
          rm -rf settings.gradle
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Xiyu"
          include ':app'
          EOF
      - name: build apk
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease
      - name: collect apks
        run: |
          OUT=android/app/build/outputs/apk/release
          ls -l "$OUT"
          for abi in armeabi-v7a arm64-v8a x86 x86_64 universal; do
            f="$OUT/app-$abi-release.apk"
            if [ -f "$f" ]; then
              cp "$f" "Xiyu-${VERSION}-android-$abi.apk"
            else
              echo "missing $abi apk"
            fi
          done
          ls -l Xiyu-*-android-*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            Xiyu-*-android-*.apk
          fail_on_unmatched_files: false

  # ---------------- iOS 原生（未签名 ipa，需自签工具安装） ----------------
  ios:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: |
          brew install xcodegen
      - name: generate app icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import json, os
          from PIL import Image
          d = "ios/Sources/Assets.xcassets/AppIcon.appiconset"
          os.makedirs("ios/Sources/Assets.xcassets", exist_ok=True)
          os.makedirs(d, exist_ok=True)
          src = Image.open("assets/icon256.png").convert("RGBA")
          src.resize((1024, 1024), Image.LANCZOS).save(d + "/AppIcon-1024.png")
          with open("ios/Sources/Assets.xcassets/Contents.json", "w") as f:
              json.dump({"info": {"author": "xcode", "version": 1}}, f)
          with open(d + "/Contents.json", "w") as f:
              json.dump({"images": [{"filename": "AppIcon-1024.png",
                                     "idiom": "universal", "platform": "ios",
                                     "size": "1024x1024"}],
                         "info": {"author": "xcode", "version": 1}}, f)
          print("icon ok")
          PY
      - name: generate
        run: |
          cd ios
          xcodegen generate
          xcodebuild -list -project Xiyu.xcodeproj
      - name: build
        run: |
          cd ios
          set +e
          xcodebuild -project Xiyu.xcodeproj -scheme Xiyu -destination "generic/platform=iOS" \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO > /tmp/xc.log 2>&1
          rc=$?
          echo "=== compile errors ==="
          grep -n "error:" /tmp/xc.log | head -40 || true
          echo "=== log tail ==="
          tail -25 /tmp/xc.log
          exit $rc
      - name: pack ipa
        run: |
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Xiyu.app out/Payload/
          cd out && zip -qry ../Xiyu-${VERSION}-ios-unsigned.ipa Payload
          ls -l ../Xiyu-*.ipa
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: Xiyu-${{ env.VERSION }}-ios-unsigned.ipa
          fail_on_unmatched_files: false
